<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Antrag prüfen', ~{::main})}">
<main>
  <div class="page-header page-header--toolbar">
    <div>
      <h2>Antrag prüfen</h2>
      <p>
        Antrag #<span th:text="${request.id}">1</span>
        · <strong th:text="${currentUnitName}">—</strong>
        · Status: <strong th:text="${request.status.label()}">Offen</strong>
      </p>
    </div>
    <div class="toolbar-actions">
      <a class="btn btn--outline" th:href="@{/atemschutz/antraege(unit=${unitId})}">Zur Liste</a>
    </div>
  </div>

  <div th:replace="~{fragments/testmode-banner :: banner}"></div>
  <div th:replace="~{fragments/flash-messages :: alerts}"></div>

  <th:block th:if="${isPending}">
    <div class="entry-request-panel" id="entry-request-view">
      <dl class="entry-request-dl">
        <div>
          <dt>Eintragstyp</dt>
          <dd th:text="${request.entryType.label()}">Übung</dd>
        </div>
        <div>
          <dt>Datum</dt>
          <dd th:text="${#temporals.format(request.eventDate, 'dd.MM.yyyy')}">01.01.2026</dd>
        </div>
        <div class="entry-request-dl__full">
          <dt>Geräteträger</dt>
          <dd>
            <ul class="entry-request-people">
              <li th:each="c : ${request.carriers}" th:text="${c.person.displayName}">Name</li>
            </ul>
          </dd>
        </div>
        <div class="entry-request-dl__full">
          <dt>Eingereicht von</dt>
          <dd>
            <span th:text="${request.requestedBy != null ? request.requestedBy.displayName : '—'}">—</span>
            <th:block th:if="${request.createdAt != null}">
              · <span th:text="${#temporals.format(request.createdAt, 'dd.MM.yyyy HH:mm')}">—</span>
            </th:block>
          </dd>
        </div>
      </dl>

      <div class="entry-request-review__actions">
        <button type="button" class="btn btn--outline" id="entry-request-edit-btn">Daten bearbeiten</button>
        <form method="post" class="entry-request-inline-form"
              th:action="@{/atemschutz/antraege/{id}/approve(id=${request.id})}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="unit" th:value="${unitId}"/>
          <input type="hidden" name="entryType" th:value="${request.entryType.name()}"/>
          <input type="hidden" name="eventDate" th:value="${request.eventDate}"/>
          <input th:each="cid : ${selectedCarrierIds}" type="hidden" name="carrierIds" th:value="${cid}"/>
          <button type="submit" class="btn btn--primary">Genehmigen</button>
        </form>
        <form method="post" class="entry-request-inline-form"
              th:action="@{/atemschutz/antraege/{id}/reject(id=${request.id})}"
              onsubmit="return confirm('Antrag wirklich ablehnen?');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="unit" th:value="${unitId}"/>
          <button type="submit" class="btn btn--danger">Ablehnen</button>
        </form>
        <a class="btn btn--outline" th:href="@{/atemschutz/antraege(unit=${unitId})}">Zurück</a>
      </div>
    </div>

    <form id="entry-request-edit" method="post" class="entry-request-panel entry-request-panel--edit" hidden
          th:action="@{/atemschutz/antraege/{id}/approve(id=${request.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="unit" th:value="${unitId}"/>

      <div class="form-grid">
        <div class="form-group">
          <label for="entryType">Eintragstyp</label>
          <select id="entryType" name="entryType" required>
            <option th:each="t : ${entryTypes}"
                    th:value="${t.name()}"
                    th:text="${t.label()}"
                    th:selected="${t == request.entryType}">Übung</option>
          </select>
        </div>
        <div class="form-group">
          <label for="eventDate">Datum</label>
          <input id="eventDate" name="eventDate" type="date" required
                 th:value="${request.eventDate}"/>
        </div>
        <div class="form-group form-group--full">
          <label>Geräteträger</label>
          <p class="hint" style="margin-top:0;">Per Klick auswählen oder abwählen. Mehrfachauswahl möglich.</p>
          <div class="entry-request-carrier-list" id="review-carrier-list"
               th:attr="data-entry-type=${request.entryType.name()}">
            <label class="entry-request-carrier"
                   th:each="c : ${allCarriers}"
                   th:classappend="${selectedCarrierIds.contains(c.id())} ? ' is-selected' : ''"
                   th:attr="data-csa=${c.csaEligible()}">
              <input type="checkbox" name="carrierIds" th:value="${c.id()}"
                     th:checked="${selectedCarrierIds.contains(c.id())}"/>
              <span th:text="${c.name()}">Name</span>
              <span class="entry-request-carrier__tag" th:if="${c.csaEligible()}">CSA</span>
            </label>
          </div>
        </div>
      </div>

      <div class="entry-request-review__actions">
        <button type="submit" class="btn btn--primary"
                th:formaction="@{/atemschutz/antraege/{id}/approve(id=${request.id})}">
          Genehmigen
        </button>
        <button type="submit" class="btn btn--outline"
                th:formaction="@{/atemschutz/antraege/{id}/save(id=${request.id})}">
          Speichern
        </button>
        <button type="button" class="btn btn--outline" id="entry-request-cancel-edit">Abbrechen</button>
      </div>
    </form>
  </th:block>

  <div th:unless="${isPending}" class="entry-request-panel">
    <p>
      Dieser Antrag ist bereits
      <strong th:text="${request.status.label()}">—</strong>.
    </p>
    <p th:if="${request.reviewedBy != null}" class="text-muted text-sm">
      Bearbeitet von <span th:text="${request.reviewedBy.displayName}">—</span>
      <th:block th:if="${request.reviewedAt != null}">
        am <span th:text="${#temporals.format(request.reviewedAt, 'dd.MM.yyyy HH:mm')}">—</span>
      </th:block>
    </p>
  </div>

  <script th:src="@{/js/atemschutz-entry-request.js(v='20260921c')}" defer></script>
</main>
</html>
