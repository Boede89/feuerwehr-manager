<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="panel(report)">
  <div class="berichte-report-meta" th:if="${report != null}"
       th:with="reportMeta=${T(de.feuerwehr.manager.berichte.BerichteReportMetaSupport).forReport(report)}">
    <dl class="berichte-report-meta__grid">
      <div class="berichte-report-meta__item" th:if="${reportMeta.source != null}">
        <dt>Quelle</dt>
        <dd th:text="${reportMeta.source}">DIVERA</dd>
      </div>
      <div class="berichte-report-meta__item" th:if="${reportMeta.recordedBy != null}">
        <dt>Erfasst von</dt>
        <dd>
          <span th:if="${reportMeta.recordedBy.username != null}"
                th:text="${reportMeta.recordedBy.username}">benutzer</span>
          <span th:unless="${reportMeta.recordedBy.username != null}"
                th:text="${reportMeta.recordedBy.displayName}">Name</span>
          <span class="berichte-report-meta__secondary"
                th:if="${reportMeta.recordedBy.username != null
                  and reportMeta.recordedBy.displayName != null
                  and !#strings.isEmpty(reportMeta.recordedBy.displayName)
                  and reportMeta.recordedBy.displayName != reportMeta.recordedBy.username}"
                th:text="'(' + ${reportMeta.recordedBy.displayName} + ')'">(Name)</span>
        </dd>
      </div>
      <div class="berichte-report-meta__item" th:if="${reportMeta.recordedAt != null}">
        <dt>Erfasst am</dt>
        <dd th:text="${#temporals.format(reportMeta.recordedAt.atZone(T(java.time.ZoneId).of('Europe/Berlin')), 'dd.MM.yyyy HH:mm')}">—</dd>
      </div>
      <div class="berichte-report-meta__item" th:if="${reportMeta.showReleasedBySeparately()}">
        <dt>Freigegeben von</dt>
        <dd>
          <span th:if="${reportMeta.releasedBy.username != null}"
                th:text="${reportMeta.releasedBy.username}">benutzer</span>
          <span th:unless="${reportMeta.releasedBy.username != null}"
                th:text="${reportMeta.releasedBy.displayName}">Name</span>
          <span class="berichte-report-meta__secondary"
                th:if="${reportMeta.releasedBy.username != null
                  and reportMeta.releasedBy.displayName != null
                  and !#strings.isEmpty(reportMeta.releasedBy.displayName)
                  and reportMeta.releasedBy.displayName != reportMeta.releasedBy.username}"
                th:text="'(' + ${reportMeta.releasedBy.displayName} + ')'">(Name)</span>
        </dd>
      </div>
      <div class="berichte-report-meta__item" th:if="${reportMeta.releasedAt != null}">
        <dt>Freigegeben am</dt>
        <dd th:text="${#temporals.format(reportMeta.releasedAt.atZone(T(java.time.ZoneId).of('Europe/Berlin')), 'dd.MM.yyyy HH:mm')}">—</dd>
      </div>
    </dl>
  </div>
</th:block>
</html>
