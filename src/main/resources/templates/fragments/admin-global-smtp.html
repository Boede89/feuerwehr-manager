<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="panel">
  <div class="card">
    <div class="card__header card__header--toolbar">
      <span>SMTP (global)</span>
      <button type="button" class="btn btn--outline btn--sm" id="btn-test-global-smtp"
              data-action="smtp-test-global">Verbindung testen</button>
    </div>
    <div class="card__body">
      <p class="hint">Zentraler Mailversand für die gesamte Installation. Der Test wird an Ihre Login-E-Mail gesendet.</p>
      <form method="post" th:action="@{/admin/global/smtp/copy-from-unit}" class="admin-smtp-copy">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="admin-smtp-copy__row">
          <div class="form-group admin-smtp-copy__unit">
            <label for="smtpCopyUnitId">SMTP aus Einheit übernehmen</label>
            <select id="smtpCopyUnitId" name="unitId" required>
              <option value="">Einheit wählen …</option>
              <option th:each="u : ${smtpCopyUnits}" th:value="${u.id}" th:text="${u.name}">Einheit</option>
            </select>
          </div>
          <div class="form-group admin-smtp-copy__account" id="smtp-copy-account-wrap" hidden>
            <label for="smtpCopyAccountId">SMTP-Konto</label>
            <select id="smtpCopyAccountId" name="smtpAccountId">
              <option value="">Erstes konfiguriertes Konto</option>
            </select>
          </div>
          <div class="form-group admin-smtp-copy__action">
            <label class="admin-smtp-copy__action-label" aria-hidden="true">&nbsp;</label>
            <button type="submit" class="btn btn--outline">Übernehmen und speichern</button>
          </div>
        </div>
        <p class="hint text-sm">Kopiert Host, Zugangsdaten und Absender aus der Einheit in die globale SMTP-Konfiguration (inkl. Passwort).</p>
      </form>
      <form method="post" th:action="@{/admin/global/smtp}" class="form-grid">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
          <label for="smtpHost">SMTP-Host</label>
          <input id="smtpHost" name="smtpHost" type="text" th:value="${globalSettings.smtpHost}" placeholder="smtp.example.de"/>
        </div>
        <div class="form-group">
          <label for="smtpPort">Port</label>
          <input id="smtpPort" name="smtpPort" type="number" min="1" max="65535"
                 th:value="${globalSettings.smtpPort != null ? globalSettings.smtpPort : 587}"/>
        </div>
        <div class="form-group">
          <label for="smtpUsername">Benutzername</label>
          <input id="smtpUsername" name="smtpUsername" type="text" autocomplete="off" th:value="${globalSettings.smtpUsername}"/>
        </div>
        <div class="form-group">
          <label for="smtpPassword">Passwort</label>
          <input id="smtpPassword" name="smtpPassword" type="password" autocomplete="new-password"
                 placeholder="Leer lassen = unverändert"/>
          <p class="hint" th:if="${smtpPasswordConfigured}">Passwort ist hinterlegt.</p>
        </div>
        <div class="form-group">
          <label for="smtpFromEmail">Absender E-Mail</label>
          <input id="smtpFromEmail" name="smtpFromEmail" type="email" th:value="${globalSettings.smtpFromEmail}"/>
        </div>
        <div class="form-group">
          <label for="smtpFromName">Absender Name</label>
          <input id="smtpFromName" name="smtpFromName" type="text" th:value="${globalSettings.smtpFromName}"/>
        </div>
        <div class="form-group">
          <label for="smtpEncryption">Verschlüsselung</label>
          <select id="smtpEncryption" name="smtpEncryption">
            <option value="TLS" th:selected="${globalSettings.smtpEncryption == 'TLS' or globalSettings.smtpEncryption == null}">TLS</option>
            <option value="SSL" th:selected="${globalSettings.smtpEncryption == 'SSL'}">SSL</option>
            <option value="NONE" th:selected="${globalSettings.smtpEncryption == 'NONE'}">Keine</option>
          </select>
        </div>
        <div class="form-group form-group--submit">
          <button type="submit" class="btn btn--primary">SMTP speichern</button>
        </div>
      </form>
    </div>
  </div>
</th:block>
</body>
</html>
