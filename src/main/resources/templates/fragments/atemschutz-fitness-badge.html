<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="badge(view)">
  <span th:if="${view != null and view.level.validityBadgeClass() != ''}"
        th:class="${view.level.validityBadgeClass()}"
        th:text="${view.level.label()}">OK</span>
  <span class="text-muted" th:if="${view != null and view.level.validityBadgeClass() == ''}"
        th:text="${view.level.label()}">Fehlt</span>
  <span class="text-muted" th:if="${view == null}">Fehlt</span>
</th:block>
<th:block th:fragment="validityDate(view)">
  <span class="text-muted" th:if="${view == null or view.validUntil == null}">—</span>
  <span th:if="${view != null and view.validUntil != null}"
        th:class="${view.level.validityBadgeClass()}"
        th:text="${#temporals.format(view.validUntil, 'dd.MM.yyyy')}">01.01.2026</span>
</th:block>
<th:block th:fragment="validityDateWithMail(view)">
  <div th:replace="~{fragments/atemschutz-fitness-badge :: validityDate(${view})}"></div>
  <span class="atemschutz-validity-mail" th:if="${view != null and view.reminderEligible}">
    <span th:if="${view.reminderSent}">
      E-Mail: <span th:text="${view.reminderLastSentLabel()}">12.08.2026, 07:00</span>
    </span>
    <span th:unless="${view.reminderSent}">
      E-Mail: noch nicht
      <span th:if="${view.reminderLastSentLabel() != null}"
            th:text="' · zuletzt ' + ${view.reminderLastSentLabel()}"> · zuletzt</span>
    </span>
  </span>
</th:block>
</html>
