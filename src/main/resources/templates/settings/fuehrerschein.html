<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Führerschein-Einstellungen', ~{::main})}">
<main>
  <div class="page-header">
    <div>
      <h2>Führerschein</h2>
      <p>Kontrollintervall und Erinnerungen · <strong th:text="${currentUnitName}">—</strong></p>
    </div>
    <div class="toolbar-actions">
      <a class="btn btn--outline" th:href="@{/personal(unit=${unitId}, tab='fuehrerscheine')}">Zur Übersicht</a>
    </div>
  </div>

  <div th:replace="~{fragments/testmode-banner :: banner}"></div>
  <div th:replace="~{fragments/flash-messages :: alerts}"></div>

  <div class="card">
    <div class="card__header">Kontrolle &amp; Erinnerungen</div>
    <div class="card__body">
      <p class="hint">
        Es wird der Originalführerschein vorgezeigt und das Ergebnis dokumentiert.
        Es werden keine Scans oder Fotokopien gespeichert.
      </p>
      <form method="post" th:action="@{/settings/fuehrerschein}" class="form-grid form-grid--2">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="unit" th:value="${unitId}"/>
        <div class="form-group">
          <label for="intervalMonths">Kontrollintervall (Monate)</label>
          <input id="intervalMonths" name="intervalMonths" type="number" min="1" max="36" required
                 th:value="${settings.intervalMonths}"/>
          <p class="hint">Standard: 12 Monate.</p>
        </div>
        <div class="form-group">
          <label for="warnDays">Warnzeit (Tage vorher)</label>
          <input id="warnDays" name="warnDays" type="number" min="0" max="365" required
                 th:value="${settings.warnDays}"/>
        </div>
        <div class="form-group form-group--full">
          <label class="checkbox-row">
            <input type="checkbox" name="notifyPerson" value="true" th:checked="${settings.notifyPerson}"/>
            <span>Person per E-Mail erinnern (wenn Adresse hinterlegt)</span>
          </label>
        </div>
        <div class="form-group form-group--full">
          <label>Zusätzlich benachrichtigen (Benutzer der Einheit)</label>
          <div class="checkbox-grid" th:if="${!#lists.isEmpty(unitUsers)}">
            <label class="checkbox-row" th:each="u : ${unitUsers}">
              <input type="checkbox" name="notificationUserIds" th:value="${u.id}"
                     th:checked="${notificationUserIds != null and notificationUserIds.contains(u.id)}"/>
              <span th:text="${u.displayName + ' (' + u.username + ')'}">Benutzer</span>
            </label>
          </div>
          <p class="hint" th:if="${#lists.isEmpty(unitUsers)}">Keine Benutzer dieser Einheit gefunden.</p>
        </div>
        <div class="form-group form-group--full form-group--submit">
          <button type="submit" class="btn btn--primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>
</main>
</html>
