<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Passwort ändern', ~{::main})}">
<main>
  <div class="page-header">
    <div>
      <h2>Passwort ändern</h2>
      <p>Bitte vergeben Sie ein neues persönliches Passwort, bevor Sie fortfahren.</p>
    </div>
  </div>
  <div th:replace="~{fragments/flash-messages :: alerts}"></div>

  <form method="post" th:action="@{/profile/password}" class="card card--narrow">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <p class="hint">
      Sie haben ein automatisch erzeugtes Passwort erhalten. Aus Sicherheitsgründen müssen Sie es jetzt ändern.
    </p>
    <div class="form-group">
      <label for="currentPassword">Aktuelles Passwort (aus der E-Mail)</label>
      <input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password"/>
    </div>
    <div class="form-group">
      <label for="newPassword">Neues Passwort</label>
      <input id="newPassword" name="newPassword" type="password" required
             th:minlength="${minPasswordLength}" autocomplete="new-password"/>
      <p class="hint" th:text="'Mindestens ' + ${minPasswordLength} + ' Zeichen.'">Mindestens 8 Zeichen.</p>
    </div>
    <div class="form-group">
      <label for="newPasswordConfirm">Neues Passwort wiederholen</label>
      <input id="newPasswordConfirm" name="newPasswordConfirm" type="password" required
             th:minlength="${minPasswordLength}" autocomplete="new-password"/>
    </div>
    <button type="submit" class="btn btn--primary btn-block">Passwort speichern und weiter</button>
  </form>
</main>
</html>
